name: Playwright Tests with MCP Agents

on:
  push:
    branches: [ feat_mcp_agent_fresh ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows 

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Start MCP agents (Planner, Generator, Healer)
      - name: Start MCP agents
        run: |
          npx playwright init-agents --loop=ci
          echo "MCP agents initialized"

      # Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      # Upload test results
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
